[pytest]
testpaths = .
addopts = -ra --strict-markers
markers =
    basic: connectivity / smoke tests
    functional: feature-level e2e tests
    stress: load and stress tests
    serial: requires device log/shell UART (--serial, default COM9)
    rtu: requires USB-RS485 adapter (--rs485-port)
    reboot: reboots the device (slow)
    upgrade: reflashes firmware via UDP upgrade (--fw-image, slow)
